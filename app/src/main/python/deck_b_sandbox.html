<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Jenny Deck B Isolated Sandbox (:8082)</title>
    <script src="/jenny_iframe_bridge.js?v=358"></script>
</head>
<body style="margin:0;padding:0;background:transparent;overflow:hidden;">
<script>
(function() {
    'use strict';
    var bridge = window.__jennyIframeBridgeV354;
    if (!bridge) return;
    var workerB = null;
    function getWorkerB() {
        if (workerB) return workerB;
        try {
            workerB = new Worker('/worker_deck_b.js?v=358');
            workerB.onmessage = function(ev) {
                var d = ev.data || {};
                bridge.emitToParent('deckB:worker_result', d);
            };
            workerB.onerror = function(err) {
                try { workerB.terminate(); } catch (e) {}
                workerB = null;
                bridge.emitToParent('deckB:worker_error', { message: String((err && err.message) || err) });
            };
        } catch (e) {
            workerB = null;
        }
        return workerB;
    }
    bridge.on('deckB:ping', function(payload) {
        bridge.emitToParent('deckB:pong', { port: 8082, ts: Date.now(), echo: payload || null });
    });
    bridge.on('deckB:worker_cmd', function(payload) {
        var w = getWorkerB();
        if (!w || !payload) {
            bridge.emitToParent('deckB:worker_result', { id: payload && payload.id, ok: false, error: 'no_worker_b' });
            return;
        }
        try {
            w.postMessage(payload);
        } catch (e) {
            bridge.emitToParent('deckB:worker_result', { id: payload.id, ok: false, error: String(e) });
        }
    });
    getWorkerB();
    bridge.emitToParent('deckB:sandbox_ready', { port: 8082, ts: Date.now() });
})();
</script>
</body>
</html>
