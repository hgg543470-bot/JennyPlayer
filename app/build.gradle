plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

def targetAbiProp = project.hasProperty('targetAbi') ? project.property('targetAbi') : 'arm64-v8a'

android {
    namespace 'com.jenny.player'
    compileSdk 33

    defaultConfig {
        applicationId "com.jenny.player"
        minSdk 24
        targetSdk 33
        versionCode 375
        versionName "1.1-b375"
        
        ndk {
            abiFilters targetAbiProp
        }
        
        python {
            version "3.11"
            buildPython "python3"
            pip {
                install "bottle"
                install "waitress"
            }
        }
    }

    signingConfigs {
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.0')
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
