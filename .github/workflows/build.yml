name: Build Jenny Player APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Оформление кода
      uses: actions/checkout@v4

    - name: Установка Java 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Установка Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Подготовка 3D-иконки JPlay (обрезка черных полей и PNG 512x512)
      run: |
        mkdir -p app/src/main/res/mipmap-xxxhdpi
        ffmpeg -y -i icon_raw.jpg -vf "crop=iw*0.80:ih*0.80,scale=512:512" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        rm -f icon_raw.jpg

    - name: Загрузка нативного Android FFmpeg (arm64-v8a)
      run: |
        mkdir -p app/src/main/jniLibs/arm64-v8a
        curl -fL -o ffmpeg-android.zip https://github.com/Tyrrrz/FFmpegBin/releases/download/9.0.2/ffmpeg-android-arm64.zip
        unzip -p ffmpeg-android.zip ffmpeg > app/src/main/jniLibs/arm64-v8a/libffmpeg.so
        rm -f ffmpeg-android.zip
        chmod 755 app/src/main/jniLibs/arm64-v8a/libffmpeg.so
        FILE_SIZE=$(stat -c%s app/src/main/jniLibs/arm64-v8a/libffmpeg.so)
        test "$FILE_SIZE" -gt 10000000

    - name: Подготовка Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '7.6'

    - name: Сборка APK
      run: gradle assembleDebug

    - name: Выдача готового файла
      uses: actions/upload-artifact@v4
      with:
        name: JennyPlayer-APK
        path: app/build/outputs/apk/debug/app-debug.apk
