name: Build Jenny Player APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Оформление кода
      uses: actions/checkout@v4

    - name: Установка Java 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Переключение на Python 3.11 (для Chaquopy)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Установка Go (для сборки торрент-ядер под 64-bit arm64-v8a и 32-bit armeabi-v7a)
      uses: actions/setup-go@v5
      with:
        go-version: '1.22.x'

    - name: Кэш нативного FFmpeg (ARM64 + ARM32) и Go-ядер на GitHub
      id: cache-native-dual
      uses: actions/cache@v4
      with:
        path: |
          app/src/main/jniLibs/arm64-v8a/libffmpeg.so
          app/src/main/jniLibs/armeabi-v7a/libffmpeg.so
          app/src/main/jniLibs/armeabi-v7a/libjtorrent.so
          app/src/main/jniLibs/armeabi-v7a/libomnitorrent.so
        key: jenny-dual-abi-native-v9.0.2-b373

    - name: Загрузка FFmpeg для 64-бит (arm64-v8a) и 32-бит (armeabi-v7a, Galaxy A30s/A20s)
      run: |
        mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a
        if [ ! -s app/src/main/jniLibs/arm64-v8a/libffmpeg.so ]; then
          curl -fL -o ffmpeg-arm64.zip https://github.com/Tyrrrz/FFmpegBin/releases/download/9.0.2/ffmpeg-android-arm64.zip
          unzip -p ffmpeg-arm64.zip ffmpeg > app/src/main/jniLibs/arm64-v8a/libffmpeg.so
          rm -f ffmpeg-arm64.zip
        fi
        if [ ! -s app/src/main/jniLibs/armeabi-v7a/libffmpeg.so ]; then
          curl -fL -o ffmpeg-arm32.zip https://github.com/Tyrrrz/FFmpegBin/releases/download/9.0.2/ffmpeg-android-arm.zip
          unzip -p ffmpeg-arm32.zip ffmpeg > app/src/main/jniLibs/armeabi-v7a/libffmpeg.so
          rm -f ffmpeg-arm32.zip
        fi

    - name: Сборка всех C/C++ ядер (libxflac, libhose_dsp, libjenny_vcore, libjenny_yt_core, libc++_shared) под ARM64 и ARM32
      run: |
        mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a
        NDK_CLANG64=$(find $ANDROID_HOME/ndk $ANDROID_NDK_LATEST_HOME -name "aarch64-linux-android24-clang++" 2>/dev/null | head -n 1)
        NDK_CLANG32=$(find $ANDROID_HOME/ndk $ANDROID_NDK_LATEST_HOME -name "armv7a-linux-androideabi24-clang++" 2>/dev/null | head -n 1)
        NDK_SYSROOT=$(dirname $(dirname "$NDK_CLANG64"))/sysroot

        # Копируем системную библиотеку libc++_shared.so из NDK для обеих архитектур
        if [ -f "$NDK_SYSROOT/usr/lib/aarch64-linux-android/libc++_shared.so" ]; then
          cp -f "$NDK_SYSROOT/usr/lib/aarch64-linux-android/libc++_shared.so" app/src/main/jniLibs/arm64-v8a/libc++_shared.so
        fi
        if [ -f "$NDK_SYSROOT/usr/lib/arm-linux-androideabi/libc++_shared.so" ]; then
          cp -f "$NDK_SYSROOT/usr/lib/arm-linux-androideabi/libc++_shared.so" app/src/main/jniLibs/armeabi-v7a/libc++_shared.so
        fi

        # 64-bit (arm64-v8a)
        if [ -n "$NDK_CLANG64" ]; then
          "$NDK_CLANG64" -O3 -march=armv8-a+simd -ffast-math -fPIC -shared app/src/main/python/jenny_vcore.cpp -o app/src/main/jniLibs/arm64-v8a/libjenny_vcore.so -lm -ldl
          cp -f app/src/main/jniLibs/arm64-v8a/libjenny_vcore.so app/src/main/jniLibs/arm64-v8a/libjenny_yt_core.so
          "$NDK_CLANG64" -O3 -ffast-math -fPIC -shared app/src/main/python/hose_splicer.cpp -o app/src/main/jniLibs/arm64-v8a/libhose_dsp.so -lm
          "$NDK_CLANG64" -x c++ -O3 -ffast-math -fPIC -shared app/src/main/jniLibs/xflac.hpp -o app/src/main/jniLibs/arm64-v8a/libxflac.so -lm
        fi

        # 32-bit (armeabi-v7a — для Samsung Galaxy A30s SM-A307FN/DS, A20s и всех 32-битных систем Android)
        if [ -n "$NDK_CLANG32" ]; then
          "$NDK_CLANG32" -O3 -march=armv7-a -mfloat-abi=softfp -mfpu=neon -ffast-math -fPIC -shared app/src/main/python/jenny_vcore.cpp -o app/src/main/jniLibs/armeabi-v7a/libjenny_vcore.so -lm -ldl
          cp -f app/src/main/jniLibs/armeabi-v7a/libjenny_vcore.so app/src/main/jniLibs/armeabi-v7a/libjenny_yt_core.so
          "$NDK_CLANG32" -O3 -march=armv7-a -mfloat-abi=softfp -mfpu=neon -ffast-math -fPIC -shared app/src/main/python/hose_splicer.cpp -o app/src/main/jniLibs/armeabi-v7a/libhose_dsp.so -lm
          "$NDK_CLANG32" -x c++ -O3 -march=armv7-a -mfloat-abi=softfp -mfpu=neon -ffast-math -fPIC -shared app/src/main/jniLibs/xflac.hpp -o app/src/main/jniLibs/armeabi-v7a/libxflac.so -lm
        fi

        python3 -m pip install --upgrade --target /tmp/ytdlp_apk_pkg --no-deps yt-dlp && rm -rf app/src/main/python/yt_dlp && mv /tmp/ytdlp_apk_pkg/yt_dlp app/src/main/python/yt_dlp

    - name: Сборка Go торрент-ядер (libjtorrent.so и libomnitorrent.so) для ARM32 (armeabi-v7a) и ARM64
      run: |
        mkdir -p /tmp/gobuild_jtor /tmp/gobuild_omni app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a

        # 1) libomnitorrent.so (чистый stdlib, собирается за ~2 сек)
        if [ ! -s app/src/main/jniLibs/armeabi-v7a/libomnitorrent.so ]; then
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w" -o app/src/main/jniLibs/armeabi-v7a/libomnitorrent.so app/src/main/python/omni_torrent_core.go
        fi
        cp -f app/src/main/jniLibs/armeabi-v7a/libomnitorrent.so app/src/main/jniLibs/armeabi-v7a/libomnitorrent_v36ir.so
        cp -f app/src/main/jniLibs/armeabi-v7a/libomnitorrent.so app/src/main/jniLibs/armeabi-v7a/libomnitorrent_v40ir.so
        if [ ! -s app/src/main/jniLibs/arm64-v8a/libomnitorrent.so ]; then
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o app/src/main/jniLibs/arm64-v8a/libomnitorrent.so app/src/main/python/omni_torrent_core.go
          cp -f app/src/main/jniLibs/arm64-v8a/libomnitorrent.so app/src/main/jniLibs/arm64-v8a/libomnitorrent_v36ir.so
          cp -f app/src/main/jniLibs/arm64-v8a/libomnitorrent.so app/src/main/jniLibs/arm64-v8a/libomnitorrent_v40ir.so
        fi

        # 2) libjtorrent.so (anacrolix/torrent v1.56.1)
        if [ ! -s app/src/main/jniLibs/armeabi-v7a/libjtorrent.so ] || [ ! -s app/src/main/jniLibs/arm64-v8a/libjtorrent.so ]; then
          cp app/src/main/python/jtorrent_core.go /tmp/gobuild_jtor/
          cd /tmp/gobuild_jtor
          go mod init jtorrent_build
          go get github.com/anacrolix/torrent@v1.56.1
          go mod tidy
          if [ ! -s "$GITHUB_WORKSPACE/app/src/main/jniLibs/armeabi-v7a/libjtorrent.so" ]; then
            CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w" -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/armeabi-v7a/libjtorrent.so" jtorrent_core.go
          fi
          if [ ! -s "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libjtorrent.so" ]; then
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libjtorrent.so" jtorrent_core.go
          fi
          cd "$GITHUB_WORKSPACE"
        fi

    - name: Права на нативные библиотеки (.so)
      run: |
        chmod 755 app/src/main/jniLibs/arm64-v8a/*.so app/src/main/jniLibs/armeabi-v7a/*.so
        rm -f icon_raw.jpg

    - name: Подготовка Gradle с кэшем
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '7.6'

    - name: Штамп номера сборки и версии в APK
      run: |
        python3 - << 'STAMP_EOF'
        import os, re, subprocess
        bnum = os.environ.get("GITHUB_RUN_NUMBER", "1")
        msg = subprocess.check_output(["git", "log", "-1", "--pretty=%s"], text=True).strip()
        msg = "".join(c for c in msg if ord(c) >= 32 and ord(c) < 127 and c not in (chr(34), chr(39), chr(92), "$"))[:48]
        s = open("app/build.gradle", "r", encoding="utf-8").read()
        s = re.sub(r"versionCode\s+\d+", lambda _: f"versionCode {bnum}", s)
        s = re.sub(r'versionName\s+"[^"]*"', lambda _: f'versionName "#{bnum} ({msg})"', s)
        open("app/build.gradle", "w", encoding="utf-8").write(s)
        STAMP_EOF

    - name: Сборка универсального APK (ARM64 + ARM32 armeabi-v7a)
      run: gradle assembleDebug

    - name: Выдача готового файла
      uses: actions/upload-artifact@v4
      with:
        name: JennyPlayer-APK
        path: app/build/outputs/apk/debug/app-debug.apk
