name: Build Jenny Player APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Оформление кода
      uses: actions/checkout@v4

    - name: Установка Java 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Переключение на Python 3.11 (для Chaquopy)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Установка Go (для сборки торрент-ядер под ARM64 и ARMv7)
      uses: actions/setup-go@v5
      with:
        go-version: '1.22.x'

    - name: Кэш нативного FFmpeg и Go-ядер (ARM64 + ARMv7)
      id: cache-native-split
      uses: actions/cache@v4
      with:
        path: /tmp/jenny_native_cache
        key: jenny-split-abi-native-v9.0.2-b375

    - name: Подготовка нативных библиотек (.so) отдельно для arm64-v8a и armeabi-v7a
      run: |
        mkdir -p /tmp/jenny_native_cache/arm64-v8a /tmp/jenny_native_cache/armeabi-v7a
        mkdir -p /tmp/jni_stage/arm64-v8a /tmp/jni_stage/armeabi-v7a

        # Сохраняем уже лежащие в репозитории arm64-v8a/*.so (если они были загружены пушем)
        if [ -d app/src/main/jniLibs/arm64-v8a ]; then
          cp -f app/src/main/jniLibs/arm64-v8a/*.so /tmp/jni_stage/arm64-v8a/ 2>/dev/null || true
        fi

        # 1) FFmpeg для arm64-v8a и armeabi-v7a
        if [ ! -s /tmp/jenny_native_cache/arm64-v8a/libffmpeg.so ]; then
          curl -fL -o ffmpeg-arm64.zip https://github.com/Tyrrrz/FFmpegBin/releases/download/9.0.2/ffmpeg-android-arm64.zip
          unzip -p ffmpeg-arm64.zip ffmpeg > /tmp/jenny_native_cache/arm64-v8a/libffmpeg.so
          rm -f ffmpeg-arm64.zip
        fi
        if [ ! -s /tmp/jenny_native_cache/armeabi-v7a/libffmpeg.so ]; then
          curl -fL -o ffmpeg-arm32.zip https://github.com/Tyrrrz/FFmpegBin/releases/download/9.0.2/ffmpeg-android-arm.zip
          unzip -p ffmpeg-arm32.zip ffmpeg > /tmp/jenny_native_cache/armeabi-v7a/libffmpeg.so
          rm -f ffmpeg-arm32.zip
        fi
        cp -f /tmp/jenny_native_cache/arm64-v8a/libffmpeg.so /tmp/jni_stage/arm64-v8a/libffmpeg.so
        cp -f /tmp/jenny_native_cache/armeabi-v7a/libffmpeg.so /tmp/jni_stage/armeabi-v7a/libffmpeg.so

        # 2) C/C++ ядра (libjenny_vcore, libjenny_yt_core, libhose_dsp, libxflac, libc++_shared)
        NDK_CLANG64=$(find $ANDROID_HOME/ndk $ANDROID_NDK_LATEST_HOME -name "aarch64-linux-android24-clang++" 2>/dev/null | head -n 1)
        NDK_CLANG32=$(find $ANDROID_HOME/ndk $ANDROID_NDK_LATEST_HOME -name "armv7a-linux-androideabi24-clang++" 2>/dev/null | head -n 1)
        NDK_SYSROOT=$(dirname $(dirname "$NDK_CLANG64"))/sysroot

        if [ -f "$NDK_SYSROOT/usr/lib/aarch64-linux-android/libc++_shared.so" ]; then
          cp -f "$NDK_SYSROOT/usr/lib/aarch64-linux-android/libc++_shared.so" /tmp/jni_stage/arm64-v8a/libc++_shared.so
        fi
        if [ -f "$NDK_SYSROOT/usr/lib/arm-linux-androideabi/libc++_shared.so" ]; then
          cp -f "$NDK_SYSROOT/usr/lib/arm-linux-androideabi/libc++_shared.so" /tmp/jni_stage/armeabi-v7a/libc++_shared.so
        fi

        if [ -n "$NDK_CLANG64" ]; then
          "$NDK_CLANG64" -O3 -march=armv8-a+simd -ffast-math -fPIC -shared app/src/main/python/jenny_vcore.cpp -o /tmp/jni_stage/arm64-v8a/libjenny_vcore.so -lm -ldl
          cp -f /tmp/jni_stage/arm64-v8a/libjenny_vcore.so /tmp/jni_stage/arm64-v8a/libjenny_yt_core.so
          "$NDK_CLANG64" -O3 -ffast-math -fPIC -shared app/src/main/python/hose_splicer.cpp -o /tmp/jni_stage/arm64-v8a/libhose_dsp.so -lm
          "$NDK_CLANG64" -x c++ -O3 -ffast-math -fPIC -shared app/src/main/jniLibs/xflac.hpp -o /tmp/jni_stage/arm64-v8a/libxflac.so -lm
        fi

        if [ -n "$NDK_CLANG32" ]; then
          "$NDK_CLANG32" -O3 -march=armv7-a -mfloat-abi=softfp -mfpu=neon -ffast-math -fPIC -shared app/src/main/python/jenny_vcore.cpp -o /tmp/jni_stage/armeabi-v7a/libjenny_vcore.so -lm -ldl
          cp -f /tmp/jni_stage/armeabi-v7a/libjenny_vcore.so /tmp/jni_stage/armeabi-v7a/libjenny_yt_core.so
          "$NDK_CLANG32" -O3 -march=armv7-a -mfloat-abi=softfp -mfpu=neon -ffast-math -fPIC -shared app/src/main/python/hose_splicer.cpp -o /tmp/jni_stage/armeabi-v7a/libhose_dsp.so -lm
          "$NDK_CLANG32" -x c++ -O3 -march=armv7-a -mfloat-abi=softfp -mfpu=neon -ffast-math -fPIC -shared app/src/main/jniLibs/xflac.hpp -o /tmp/jni_stage/armeabi-v7a/libxflac.so -lm
        fi

        # 3) Go торрент-ядра (libomnitorrent.so и libjtorrent.so)
        if [ ! -s /tmp/jenny_native_cache/armeabi-v7a/libomnitorrent.so ]; then
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w" -o /tmp/jenny_native_cache/armeabi-v7a/libomnitorrent.so app/src/main/python/omni_torrent_core.go
        fi
        cp -f /tmp/jenny_native_cache/armeabi-v7a/libomnitorrent.so /tmp/jni_stage/armeabi-v7a/libomnitorrent.so

        if [ ! -s /tmp/jni_stage/arm64-v8a/libomnitorrent.so ]; then
          if [ ! -s /tmp/jenny_native_cache/arm64-v8a/libomnitorrent.so ]; then
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o /tmp/jenny_native_cache/arm64-v8a/libomnitorrent.so app/src/main/python/omni_torrent_core.go
          fi
          cp -f /tmp/jenny_native_cache/arm64-v8a/libomnitorrent.so /tmp/jni_stage/arm64-v8a/libomnitorrent.so
        fi

        if [ ! -s /tmp/jenny_native_cache/armeabi-v7a/libjtorrent.so ] || [ ! -s /tmp/jni_stage/arm64-v8a/libjtorrent.so ]; then
          mkdir -p /tmp/gobuild_jtor
          cp app/src/main/python/jtorrent_core.go /tmp/gobuild_jtor/
          cd /tmp/gobuild_jtor
          go mod init jtorrent_build
          go get github.com/anacrolix/torrent@v1.56.1
          go mod tidy
          if [ ! -s /tmp/jenny_native_cache/armeabi-v7a/libjtorrent.so ]; then
            CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w" -o /tmp/jenny_native_cache/armeabi-v7a/libjtorrent.so jtorrent_core.go
          fi
          if [ ! -s /tmp/jni_stage/arm64-v8a/libjtorrent.so ]; then
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o /tmp/jni_stage/arm64-v8a/libjtorrent.so jtorrent_core.go
          fi
          cd "$GITHUB_WORKSPACE"
        fi
        cp -f /tmp/jenny_native_cache/armeabi-v7a/libjtorrent.so /tmp/jni_stage/armeabi-v7a/libjtorrent.so

        chmod 755 /tmp/jni_stage/arm64-v8a/*.so /tmp/jni_stage/armeabi-v7a/*.so
        python3 -m pip install --upgrade --target /tmp/ytdlp_apk_pkg --no-deps yt-dlp && rm -rf app/src/main/python/yt_dlp && mv /tmp/ytdlp_apk_pkg/yt_dlp app/src/main/python/yt_dlp
        rm -f icon_raw.jpg

    - name: Подготовка Gradle с кэшем
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '7.6'

    - name: Штамп номера сборки и версии в APK
      run: |
        python3 - << 'STAMP_EOF'
        import os, re, subprocess
        bnum = os.environ.get("GITHUB_RUN_NUMBER", "1")
        msg = subprocess.check_output(["git", "log", "-1", "--pretty=%s"], text=True).strip()
        msg = "".join(c for c in msg if ord(c) >= 32 and ord(c) < 127 and c not in (chr(34), chr(39), chr(92), "$"))[:48]
        s = open("app/build.gradle", "r", encoding="utf-8").read()
        s = re.sub(r"versionCode\s+\d+", lambda _: f"versionCode {bnum}", s)
        s = re.sub(r'versionName\s+"[^"]*"', lambda _: f'versionName "#{bnum} ({msg})"', s)
        open("app/build.gradle", "w", encoding="utf-8").write(s)
        STAMP_EOF

    - name: Сборка APK №1 — отдельно под 64-bit (arm64-v8a)
      env:
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx4096m -Xms512m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8\""
      run: |
        rm -rf app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a
        mkdir -p app/src/main/jniLibs/arm64-v8a dist
        cp -f /tmp/jni_stage/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
        gradle assembleDebug -PtargetAbi=arm64-v8a --no-daemon
        cp -f app/build/outputs/apk/debug/app-debug.apk dist/JennyPlayer-arm64-v8a.apk

    - name: Сборка APK №2 — отдельно под 32-bit (armeabi-v7a для Galaxy A30s / A20s)
      env:
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx4096m -Xms512m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8\""
      run: |
        rm -rf app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a
        mkdir -p app/src/main/jniLibs/armeabi-v7a dist
        cp -f /tmp/jni_stage/armeabi-v7a/*.so app/src/main/jniLibs/armeabi-v7a/
        gradle clean assembleDebug -PtargetAbi=armeabi-v7a --no-daemon
        cp -f app/build/outputs/apk/debug/app-debug.apk dist/JennyPlayer-armeabi-v7a.apk
        # Возвращаем 64-битный APK также по стандартному пути app-debug.apk для совместимости
        cp -f dist/JennyPlayer-arm64-v8a.apk app/build/outputs/apk/debug/app-debug.apk

    - name: Выдача APK 64-bit (arm64-v8a)
      uses: actions/upload-artifact@v4
      with:
        name: JennyPlayer-APK-arm64-v8a
        path: dist/JennyPlayer-arm64-v8a.apk

    - name: Выдача APK 32-bit (armeabi-v7a для Galaxy A30s / A20s)
      uses: actions/upload-artifact@v4
      with:
        name: JennyPlayer-APK-armeabi-v7a
        path: dist/JennyPlayer-armeabi-v7a.apk

    - name: Выдача общего пакета (оба APK)
      uses: actions/upload-artifact@v4
      with:
        name: JennyPlayer-APK
        path: dist/*.apk
