name: Build Jenny Player APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Оформление кода
      uses: actions/checkout@v4

    - name: Установка Java 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Переключение на Python 3.11 (для Chaquopy)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Кэш нативного FFmpeg на GitHub
      id: cache-ffmpeg
      uses: actions/cache@v4
      with:
        path: app/src/main/jniLibs/arm64-v8a/libffmpeg.so
        key: jenny-ffmpeg-arm64-v9.0.2

    - name: Загрузка FFmpeg (только если нет в кэше GitHub)
      if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
      run: |
        mkdir -p app/src/main/jniLibs/arm64-v8a
        curl -fL -o ffmpeg-android.zip https://github.com/Tyrrrz/FFmpegBin/releases/download/9.0.2/ffmpeg-android-arm64.zip
        unzip -p ffmpeg-android.zip ffmpeg > app/src/main/jniLibs/arm64-v8a/libffmpeg.so
        rm -f ffmpeg-android.zip

    - name: Сборка нативного C++/NEON ядра libjenny_vcore.so (ARM64)
      run: |
        mkdir -p app/src/main/jniLibs/arm64-v8a
        NDK_CLANG=$(find $ANDROID_HOME/ndk $ANDROID_NDK_LATEST_HOME -name "aarch64-linux-android24-clang++" 2>/dev/null | head -n 1)
        if [ -n "$NDK_CLANG" ]; then
          echo "Compiling libjenny_vcore.so with $NDK_CLANG"
          "$NDK_CLANG" -O3 -march=armv8-a+simd -ffast-math -fPIC -shared app/src/main/python/jenny_vcore.cpp -o app/src/main/jniLibs/arm64-v8a/libjenny_vcore.so -lm -ldl
        fi

    - name: Права на нативные библиотеки (.so)
      run: |
        chmod 755 app/src/main/jniLibs/arm64-v8a/*.so
        rm -f icon_raw.jpg

    - name: Подготовка Gradle с кэшем
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '7.6'

    - name: Штамп номера сборки и версии в APK
      run: |
        python3 - << 'STAMP_EOF'
        import os, re, subprocess
        bnum = os.environ.get("GITHUB_RUN_NUMBER", "1")
        msg = subprocess.check_output(["git", "log", "-1", "--pretty=%s"], text=True).strip()
        msg = "".join(c for c in msg if ord(c) >= 32 and c not in (chr(34), chr(39), chr(92), "$"))[:48]
        s = open("app/build.gradle", "r", encoding="utf-8").read()
        s = re.sub("versionCode\s+\d+", lambda _: f"versionCode {bnum}", s)
        s = re.sub("versionName\s+\"[^\"]*\"", lambda _: f"versionName \"#{bnum} ({msg})\"", s)
        open("app/build.gradle", "w", encoding="utf-8").write(s)
        STAMP_EOF

    - name: Сборка APK
      run: gradle assembleDebug

    - name: Выдача готового файла
      uses: actions/upload-artifact@v4
      with:
        name: JennyPlayer-APK
        path: app/build/outputs/apk/debug/app-debug.apk

